name: Supabase Keep-Alive

# Free tier do Supabase pausa o projeto depois de ~7 dias sem chamada de API.
# Esse job só bate uma leitura leve na REST API a cada ~3 dias pra manter vivo.

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tours?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then
            echo "Ping falhou — Supabase pode estar pausado ou a key mudou."
            exit 1
          fi
